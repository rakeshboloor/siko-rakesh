<html lang="en">

  <title>SIKO Eduventures — Your classroom. Your teacher. Your learning journey. Anywhere.</title>

  <!-- Google Fonts: Inter, Plus Jakarta Sans & JetBrains Mono -->

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN — provides all utility classes used in templates -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontSize: {
            '2xs': ['0.75rem',  { lineHeight: '1.15rem' }],
            '3xs': ['0.6875rem',{ lineHeight: '1.05rem' }],
          },
          colors: {
            'siko-blue':  { 50:'#F0F7FF',100:'#E0EFFE',200:'#BAE0FD',300:'#7CC4FA',400:'#38BDF8',500:'#2563EB',600:'#1D4ED8',700:'#1E40AF',800:'#1E3A8A',900:'#172554' },
            'siko-amber': { 50:'#FFFBEB',100:'#FEF3C7',400:'#FBBF24',500:'#F59E0B',600:'#D97706' },
            'siko-emerald':{ 50:'#ECFDF5',100:'#D1FAE5',500:'#10B981',600:'#059669',700:'#047857' },
          },
          fontFamily: {
            sans: ['"Inter"','"Plus Jakarta Sans"','ui-sans-serif','system-ui','sans-serif'],
            heading: ['"Plus Jakarta Sans"','"Inter"','ui-sans-serif','system-ui','sans-serif'],
            mono: ['"JetBrains Mono"','ui-monospace','monospace'],
          },
          animation: {
            'fade-in':       'fadeIn 0.35s ease-out both',
            'slide-up':      'slideUp 0.4s ease-out both',
            'slide-in-right':'slideInRight 0.3s ease-out both',
            'float':         'float 6s ease-in-out infinite',
            'pulse-slow':    'pulse 3s ease-in-out infinite',
            'gradient':      'gradientShift 8s ease infinite',
            'count-up':      'countUp 1.2s ease-out both',
          },
          keyframes: {
            fadeIn:       { from:{opacity:'0'},                                        to:{opacity:'1'} },
            slideUp:      { from:{opacity:'0',transform:'translateY(12px)'},           to:{opacity:'1',transform:'translateY(0)'} },
            slideInRight: { from:{opacity:'0',transform:'translateX(12px)'},           to:{opacity:'1',transform:'translateX(0)'} },
            float:        { '0%,100%':{transform:'translateY(0)'},           '50%':{transform:'translateY(-8px)'} },
            gradientShift:{ '0%,100%':{backgroundPosition:'0% 50%'},         '50%':{backgroundPosition:'100% 50%'} },
            countUp:      { from:{opacity:'0',transform:'translateY(6px) scale(0.97)'},to:{opacity:'1',transform:'translateY(0) scale(1)'} },
          },
          backgroundSize: { '300%':'300%' },
          boxShadow: {
            'siko':       '0 4px 20px -2px rgba(29,78,216,0.10)',
            'siko-lg':    '0 10px 30px -4px rgba(29,78,216,0.14)',
            'card':       '0 1px 3px rgba(15,23,42,0.04), 0 4px 14px rgba(15,23,42,0.04)',
            'card-hover': '0 8px 24px rgba(15,23,42,0.08), 0 2px 6px rgba(15,23,42,0.04)',
          },
        },
      },
    };
  </script>

  <!-- SIKO Design System CSS -->
  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/classroom.css">
  <link rel="stylesheet" href="./css/responsive.css">

  <style>
    /* ====================================================================
       SIKO DYNAMIC ANIMATIONS & VISUAL POLISH
       ================================================================== */

    /* Page-level entrance */
    #app > * { animation: sikoFadeIn 0.35s ease-out both; }
    @keyframes sikoFadeIn {
      from { opacity:0; transform:translateY(10px); }
      to   { opacity:1; transform:translateY(0); }
    }

    /* Animated gradient headline text */
    .gradient-text {
      background: linear-gradient(135deg,#1E3A8A 0%,#2563EB 40%,#7C3AED 70%,#DB2777 100%);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: gradientShift 6s ease infinite;
    }
    @keyframes gradientShift {
      0%,100% { background-position:0% 50%; }
      50%     { background-position:100% 50%; }
    }

    /* Hero section animated bg */
    .hero-gradient-bg {
      background: linear-gradient(135deg,#F0F4FF 0%,#EFF6FF 30%,#F5F3FF 60%,#FFF7ED 100%);
      background-size: 300% 300%;
      animation: gradientShift 12s ease infinite;
    }

    /* Card hover lift */
    .hover-lift {
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      will-change: transform;
    }
    .hover-lift:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 40px rgba(37,99,235,0.15);
    }

    /* Live pulsing dot */
    .live-dot {
      width:8px; height:8px;
      border-radius:50%;
      background:#10B981;
      position:relative;
      display:inline-block;
    }
    .live-dot::after {
      content:'';
      position:absolute; inset:-4px;
      border-radius:50%;
      background:rgba(16,185,129,0.35);
      animation:livePulse 1.8s ease-in-out infinite;
    }
    @keyframes livePulse {
      0%,100% { transform:scale(1); opacity:1; }
      50%     { transform:scale(1.8); opacity:0; }
    }

    /* Shimmer skeleton */
    .shimmer {
      background: linear-gradient(90deg,#f0f4ff 25%,#e8eeff 50%,#f0f4ff 75%);
      background-size: 200% 100%;
      animation: shimmer 1.8s infinite;
    }
    @keyframes shimmer {
      0%   { background-position:200% 0; }
      100% { background-position:-200% 0; }
    }

    /* Scroll reveal */
    .reveal {
      opacity:1;
      transform:translateY(0);
      transition: opacity 0.45s ease, transform 0.45s ease;
    }
    .reveal.visible { opacity:1; transform:translateY(0); }

    /* Floating classroom visual */
    .float-card { animation: floatCard 6s ease-in-out infinite; }
    @keyframes floatCard {
      0%,100% { transform:translateY(0); }
      50%     { transform:translateY(-10px); }
    }

    /* Primary CTA pulse ring */
    .btn-pulse { position:relative; overflow:visible; }
    .btn-pulse::after {
      content:'';
      position:absolute; inset:-4px;
      border-radius:inherit;
      border:2px solid rgba(37,99,235,0.4);
      animation:btnPulse 2.5s ease-in-out infinite;
    }
    @keyframes btnPulse {
      0%,100% { transform:scale(1); opacity:1; }
      50%     { transform:scale(1.08); opacity:0; }
    }

    /* Typing cursor */
    .typing-cursor::after {
      content:'|';
      animation:blink 0.9s step-end infinite;
      color:#2563EB;
      font-weight:300;
    }
    @keyframes blink {
      0%,100% { opacity:1; }
      50%     { opacity:0; }
    }

    /* Subtle glass surfaces */
    .glass {
      background: rgba(255,255,255,0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.5);
    }

    /* Staggered animation delays */
    .stagger-1 { animation-delay:0.05s; }
    .stagger-2 { animation-delay:0.10s; }
    .stagger-3 { animation-delay:0.15s; }
    .stagger-4 { animation-delay:0.20s; }
    .stagger-5 { animation-delay:0.25s; }
    .stagger-6 { animation-delay:0.30s; }

    /* Teacher card hover glow */
    .teacher-card-dynamic {
      transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
      border: 1px solid transparent;
    }
    .teacher-card-dynamic:hover {
      border-color: rgba(37,99,235,0.2);
      box-shadow: 0 0 0 3px rgba(37,99,235,0.06), 0 12px 40px rgba(37,99,235,0.12);
      transform: translateY(-3px);
    }

    /* View transition */
    .app-main-content { animation: sikoFadeIn 0.3s ease-out both; }

    /* Hero classroom dark mockup */
    .classroom-mockup {
      background: linear-gradient(160deg,#0F172A 0%,#1E1B4B 50%,#1E3A8A 100%);
      border-radius:16px;
      box-shadow: 0 24px 80px rgba(15,23,42,0.4), 0 0 0 1px rgba(255,255,255,0.06);
    }

    /* Dot-grid pattern */
    .hero-dots {
      background-image: radial-gradient(rgba(37,99,235,0.12) 1.5px,transparent 1.5px);
      background-size: 28px 28px;
    }

    /* Wavy amber underline */
    .decoration-amber-400 { text-decoration-color:#FBBF24; }
    .decoration-wavy      { text-decoration-style:wavy; }

    /* Large stat numbers */
    .stat-number {
      font-size:2.5rem;
      font-weight:800;
      line-height:1;
      letter-spacing:-0.03em;
    }

    /* Notification badge dot */
    .notif-dot {
      width:8px; height:8px;
      background:#EF4444;
      border-radius:50%;
      border:2px solid #fff;
      display:inline-block;
    }

    /* Left accent border card */
    .card-accent-left { border-left:3px solid #3B82F6; }

    /* Hero section layout */
    .public-hero-section {
      min-height: calc(100vh - 72px);
      display: flex;
      align-items: center;
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <!-- SIKO Application (ES Module) -->
  <script type="module" src="./js/app.js"></script>

  <!-- Scroll-reveal observer (re-runs after every SPA render) -->
  <script>
    function activateReveal() {
      const io = new IntersectionObserver(entries => {
        entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
      }, { threshold: 0.12 });
      document.querySelectorAll('.reveal:not(.visible)').forEach(el => io.observe(el));
    }
    document.addEventListener('DOMContentLoaded', activateReveal);
    window._activateReveal = activateReveal;

    /* Auto-increment stat counters */
    window._animateCounters = function() {
      document.querySelectorAll('[data-count]').forEach(el => {
        const target = parseInt(el.dataset.count, 10);
        let start = 0;
        const step = Math.ceil(target / 40);
        const timer = setInterval(() => {
          start = Math.min(start + step, target);
          el.textContent = start.toLocaleString() + (el.dataset.suffix || '');
          if (start >= target) clearInterval(timer);
        }, 30);
      });
    };

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
