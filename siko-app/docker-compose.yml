version: '3.8'

services:
  siko-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: siko_app_production
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - API_PORT=8000
      - DATABASE_URL=sqlite:///./siko.db
      - SECRET_KEY=${SECRET_KEY:-siko-super-secret-jwt-key-2026-production-change-this}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-rzp_live_PENDING_FROM_CTO}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-PENDING_FROM_CTO}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET:-PENDING_FROM_CTO}
    volumes:
      - siko_data:/app/backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: siko_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - siko-app

volumes:
  siko_data:
    driver: local
